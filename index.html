
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #ffffff;
    }

    h1 {
      font-size: 28px;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
    }

    #reader video {
      max-width: 100%;
    }

    #result {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
      white-space: pre-line;
    }

    #status {
      font-size: 20px;
      min-height: 1.5em;
    }

    button {
      font-size: 20px;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .ok {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <h1>社員受付</h1>

  <p id="status">社員情報を読み込んでいます…</p>

  <div id="reader"></div>

  <div id="result"></div>

  <div id="buttons"></div>

  <script>
    // ========================================
    // Apps Script URL
    // ========================================
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyAJlvXfXFLtn0iTYh6obTzeoe-YkTW8YVzVMtAHPEsOzEnkO_6scH3_9W8MOCzE9Yh/exec";

    // ========================================
    // 状態管理
    // ========================================
    let scanner = null;
    let employees = [];
    let currentToken = "";
    let processing = false;
    let audioContext = null;
    let resetTimer = null;
    let scannerGeneration = 0;

    // ========================================
    // QRIDの表記統一
    // ========================================
    function normalizeToken(token) {
      return String(token || "")
        .replace(/\s/g, "")
        .trim();
    }

    // ========================================
    // 成功音
    // ========================================
    function prepareAudio() {
      try {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }
      } catch (e) {
        // 音声が使えなくても受付は続行
      }
    }

    function playSuccessSound() {
      if (!audioContext) return;

      try {
        if (audioContext.state !== "running") {
          return;
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 1000;

        gain.gain.setValueAtTime(
          0.15,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.2
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(
          audioContext.currentTime + 0.2
        );
      } catch (e) {
        // 音声エラーは無視
      }
    }

    // ========================================
    // Apps ScriptとのJSONP通信
    // ========================================
    function requestJSONP(params, onSuccess, onError) {
      const callbackName =
        "cb_" + Date.now() + "_" +
        Math.floor(Math.random() * 1000000);

      const script = document.createElement("script");
      let finished = false;

      const timer = setTimeout(() => {
        cleanup();
        onError("通信がタイムアウトしました。");
      }, 15000);

      function cleanup() {
        if (finished) return;

        finished = true;
        clearTimeout(timer);

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

        script.remove();
      }

      window[callbackName] = result => {
        cleanup();
        onSuccess(result);
      };

      script.onerror = () => {
        cleanup();
        onError("サーバーとの通信に失敗しました。");
      };

      const query = new URLSearchParams({
        ...params,
        callback: callbackName,
        t: Date.now()
      });

      script.src =
        APPS_SCRIPT_URL + "?" + query.toString();

      document.body.appendChild(script);
    }

    // ========================================
    // メッセージ表示
    // ========================================
    function showMessage(message, type) {
      const result = document.getElementById("result");

      result.className = type || "";
      result.textContent = message;
    }

    // ========================================
    // カメラ停止
    // ========================================
    async function stopScanner() {
      const oldScanner = scanner;

      // 古い読み取りイベントを無効にする
      scanner = null;
      scannerGeneration++;

      if (!oldScanner) return;

      try {
        await oldScanner.clear();
      } catch (e) {
        // 停止済みの場合など
      }
    }

    // ========================================
    // カメラボタンの日本語化
    // ========================================
    function translateCameraButtons() {
      const buttons =
        document.querySelectorAll("#reader button");

      buttons.forEach(button => {
        const text = button.textContent.trim();

        if (
          text.includes("Request Camera Permissions") ||
          text.includes("Start Camera")
        ) {
          button.textContent = "カメラを起動";
        }

        if (text.includes("Stop Scanning")) {
          button.textContent = "カメラを停止";
        }

        if (text.includes("Scan an Image File")) {
          button.textContent = "画像ファイルを読み取る";
        }
      });
    }

    // ========================================
    // 社員一覧を一括取得
    // ========================================
    function loadEmployeesAndStart() {
      processing = true;

      document.getElementById("status").textContent =
        "社員情報を読み込んでいます…";

      document.getElementById("buttons").innerHTML = "";
      showMessage("", "");

      requestJSONP(
        { action: "employees" },

        response => {
          if (
            !response ||
            !response.ok ||
            !Array.isArray(response.employees)
          ) {
            processing = false;

            showMessage(
              "社員情報を取得できませんでした。",
              "error"
            );

            showLoadRetry();
            return;
          }

          employees = response.employees.map(employee => ({
            id: String(employee.id || "").trim(),
            name: String(employee.name || "").trim(),
            token: normalizeToken(employee.token)
          }));

          processing = false;
          startScanner();
        },

        message => {
          processing = false;
          showMessage(message, "error");
          showLoadRetry();
        }
      );
    }

    function showLoadRetry() {
      const buttons = document.getElementById("buttons");
      buttons.innerHTML = "";

      const retry = document.createElement("button");
      retry.textContent = "社員情報を再取得";
      retry.onclick = loadEmployeesAndStart;

      buttons.appendChild(retry);
    }

    // ========================================
    // カメラ開始
    // ========================================
    function startScanner() {
      if (scanner) return;

      clearTimeout(resetTimer);
      resetTimer = null;

      currentToken = "";
      processing = false;

      document.getElementById("buttons").innerHTML = "";
      showMessage("", "");

      document.getElementById("status").textContent =
        "QRカードをカメラに映してください";

      const reader = document.getElementById("reader");
      reader.innerHTML = "";

      const generation = ++scannerGeneration;

      try {
        scanner = new Html5QrcodeScanner(
          "reader",
          {
            fps: 20,
            qrbox: {
              width: 280,
              height: 280
            },
            rememberLastUsedCamera: true
          },
          false
        );

        scanner.render(
          decodedText => {
            // 古いカメラから届いたイベントは無視
            if (generation !== scannerGeneration) return;

            onScanSuccess(decodedText);
          },
          () => {}
        );

        setTimeout(translateCameraButtons, 300);
        setTimeout(translateCameraButtons, 1000);

      } catch (error) {
        scanner = null;

        showMessage(
          "カメラを起動できません。画面を再読み込みしてください。",
          "error"
        );

        document.getElementById("status").textContent =
          "カメラの起動に失敗しました";
      }
    }

    // ========================================
    // QRコード読み取り・社員認証
    // ========================================
    async function onScanSuccess(decodedText) {
      if (processing) return;

      currentToken = normalizeToken(decodedText);

      if (!currentToken) return;

      processing = true;

      // 読み取り直後にカメラを停止
      await stopScanner();

      document.getElementById("status").textContent =
        "社員情報を確認中です…";

      // サーバー通信せず端末内で社員を検索
      const employee = employees.find(
        item => item.token === currentToken
      );

      if (!employee) {
        showMessage(
          "社員が見つかりません。\nQRカードを確認してください。",
          "error"
        );

        showRetry();
        return;
      }

      document.getElementById("status").textContent =
        "社員情報を確認しました";

      showMessage(
        employee.name + " さん\nこの名前で記録しますか？",
        ""
      );

      const buttons = document.getElementById("buttons");
      buttons.innerHTML = "";

      const okButton = document.createElement("button");
      okButton.textContent = "本人です";

      okButton.onclick = () => {
        if (okButton.disabled) return;

        okButton.disabled = true;
        prepareAudio();

        showMessage("出席を記録しています…", "");

        document.getElementById("status").textContent =
          "出席情報を登録中です";

        requestJSONP(
          {
            action: "attendance",
            token: currentToken
          },

          response => {
            if (!response || !response.ok) {
              showMessage(
                response?.message ||
                  "出席記録に失敗しました。",
                "error"
              );

              showRetry();
              return;
            }

            // 出席記録成功
            playSuccessSound();

            showMessage(
              "✓ " + response.name +
                " さんの出席を記録しました。",
              "ok"
            );

            buttons.innerHTML = "";

            document.getElementById("status").textContent =
              "受付完了！次の方をお待ちしています";

            // 次の人の受付へ
            clearTimeout(resetTimer);

            resetTimer = setTimeout(() => {
              resetScanner();
            }, 1000);
          },

          message => {
            showMessage(message, "error");
            showRetry();
          }
        );
      };

      buttons.appendChild(okButton);

      const retryButton = document.createElement("button");
      retryButton.textContent = "違います";
      retryButton.onclick = resetScanner;

      buttons.appendChild(retryButton);
    }

    // ========================================
    // 再読み取りボタン
    // ========================================
    function showRetry() {
      const buttons = document.getElementById("buttons");

      document.getElementById("status").textContent =
        "QRコードをもう一度確認してください";

      buttons.innerHTML = "";

      const retry = document.createElement("button");
      retry.textContent = "もう一度読み取る";
      retry.onclick = resetScanner;

      buttons.appendChild(retry);
    }

    // ========================================
    // 次の人の受付へ戻る
    // ========================================
    async function resetScanner() {
      if (processing && scanner) {
        // 読み取り中の二重操作を防ぐ
        return;
      }

      clearTimeout(resetTimer);
      resetTimer = null;

      await stopScanner();

      document.getElementById("reader").innerHTML = "";

      processing = false;
      startScanner();
    }

    // ========================================
    // 初回起動
    // ========================================
    loadEmployeesAndStart();
  </script>

</body>
</html>
