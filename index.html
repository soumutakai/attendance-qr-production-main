<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --brown: #805337;
      --brown-dark: #704329;
      --cream: #fff8e8;
      --cream-border: #f4d6ad;
      --green: #5ca56d;
    }

    body {
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      text-align: center;
      padding: 20px 12px 28px;
      margin: 0;
      min-height: 100vh;
      color: var(--brown);
      background-color: #fff5d9;
      background-image: url("background.png");
      background-position: center top;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* タイトル：木の看板風 */
    h1 {
      display: inline-block;
      position: relative;
      max-width: 94%;
      margin: 12px auto 24px;
      padding: 14px 42px 16px;
      border: 4px solid #d99b5d;
      border-radius: 28px 24px 30px 22px;
      background: linear-gradient(
        180deg,
        #ffe0a1 0%,
        #f8c77f 55%,
        #edb56e 100%
      );
      box-shadow:
        inset 0 3px 0 rgba(255,255,255,.65),
        inset 0 -4px 0 rgba(156,91,43,.12),
        0 5px 0 rgba(151,94,49,.12);
      color: #794727;
      font-size: clamp(25px, 4vw, 42px);
      font-weight: 900;
      letter-spacing: .12em;
      text-shadow: 0 1px 0 rgba(255,255,255,.6);
    }

    /* 受付結果パネル */
    #result {
      margin: 12px auto 16px;
      padding: 20px 16px;
      width: 100%;
      max-width: 820px;
      min-height: 0;
      font-size: clamp(23px, 3vw, 36px);
      font-weight: 900;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
      border: 5px solid var(--cream-border);
      border-radius: 48px;
      background: rgba(255, 249, 233, .96);
      box-shadow:
        0 5px 0 rgba(184, 129, 73, .10),
        inset 0 0 0 2px rgba(255,255,255,.8);
    }

    #result:empty {
      display: none;
    }

    #result.ok {
      color: #805337;
      background: rgba(255, 249, 233, .97);
      border-color: #f0d1a6;
    }

    #result.error {
      color: #a8322c;
      background: rgba(255, 244, 233, .98);
      border-color: #e5a08b;
    }

    #result.waiting {
      color: #805337;
      background: rgba(255, 249, 233, .97);
      border-color: #e8c89d;
    }

    /* 状態表示 */
    #status {
      display: block;
      width: fit-content;
      max-width: 95%;
      margin: 12px auto;
      padding: 6px 18px;
      border-radius: 18px;
      color: var(--brown);
      background: rgba(255, 249, 233, .70);
      font-size: clamp(17px, 2.2vw, 23px);
      font-weight: 900;
      line-height: 1.5;
      text-shadow: 0 1px 0 rgba(255,255,255,.85);
    }

    /* カメラ：クリーム色の丸いフレーム */
    #reader {
      width: 100%;
      max-width: 640px;
      margin: 14px auto 10px;
      padding: 10px;
      border: 5px solid var(--cream-border);
      border-radius: 38px;
      background: rgba(255, 249, 233, .97);
      box-shadow:
        0 5px 0 rgba(184, 129, 73, .12),
        inset 0 0 0 2px rgba(255,255,255,.85);
      overflow: hidden;
      color: var(--brown);
    }

    #reader video {
      display: block;
      width: 100% !important;
      max-width: 100%;
      border-radius: 24px;
      object-fit: cover;
    }

    #reader__scan_region {
      min-height: 240px;
      border-radius: 24px;
      overflow: hidden;
      background: #f7ead2;
    }

    #reader__scan_region video {
      border-radius: 24px;
    }

    #reader__dashboard {
      padding-top: 8px;
      color: var(--brown);
      font-size: 15px;
    }

    #reader__dashboard_section_csr,
    #reader__dashboard_section_swaplink {
      color: var(--brown);
    }

    #reader a {
      color: var(--brown);
    }

    /* カメラ選択 */
    #reader select {
      max-width: 100%;
      padding: 8px 10px;
      border: 1px solid #e7c99f;
      border-radius: 999px;
      background: #fff4dc;
      color: var(--brown);
      font-size: 15px;
    }

    /* カメラ操作ボタン */
    #reader button {
      max-width: 100%;
      font-size: 16px;
      font-weight: 800;
      padding: 11px 17px;
      margin: 5px;
      border: 2px solid #e5c29a;
      border-radius: 999px;
      background: linear-gradient(#d6a77e, #bd895f);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(126, 78, 43, .12);
    }

    #reader button:hover,
    #buttons button:hover {
      filter: brightness(1.04);
    }

    /* 再試行ボタン */
    #buttons button {
      font-size: 18px;
      font-weight: 900;
      padding: 13px 24px;
      margin: 8px;
      border: 2px solid #e5c29a;
      border-radius: 999px;
      background: linear-gradient(#d6a77e, #bd895f);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(126, 78, 43, .14);
    }

    /* 画面下の案内 */
    .hint {
      display: inline-block;
      max-width: 640px;
      margin: 12px auto;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 249, 233, .68);
      color: var(--brown);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.8;
      text-shadow: 0 1px 0 rgba(255,255,255,.85);
    }

    /* スマホ・タブレット向け */
    @media (max-width: 600px) {
      body {
        padding: 12px 8px 22px;
      }

      h1 {
        margin: 8px auto 18px;
        padding: 11px 24px 13px;
        border-radius: 22px;
        letter-spacing: .08em;
      }

      #result {
        padding: 16px 10px;
        border-radius: 30px;
        border-width: 4px;
      }

      #reader {
        padding: 7px;
        border-width: 4px;
        border-radius: 28px;
      }

      #reader__scan_region,
      #reader video {
        border-radius: 18px;
      }

      #reader button {
        font-size: 14px;
        padding: 9px 12px;
      }

      #status {
        font-size: 17px;
      }

      .hint {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <h1>社員受付</h1>

  <!-- 受付結果を画面上部に表示 -->
  <div id="result" aria-live="polite"></div>

  <p id="status">カメラを準備しています…</p>

  <div id="reader"></div>

  <div id="buttons"></div>

  <p class="hint">
    QRカードを1枚ずつカメラに映してください。<br>
    出席記録は自動で行われます。
  </p>

  <script>
    // ========================================
    // Apps Script URL（本番用）
    // ========================================
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyAJlvXfXFLtn0iTYh6obTzeoe-YkTW8YVzVMtAHPEsOzEnkO_6scH3_9W8MOCzE9Yh/exec";

    // ========================================
    // 状態管理
    // ========================================
    let scanner = null;
    let processing = false;
    let lastHandledToken = "";
    let messageTimer = null;
    let audioContext = null;

    // ========================================
    // QRIDの表記統一
