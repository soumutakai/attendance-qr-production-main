<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --brown: #805337;
      --brown-dark: #704329;
      --cream: #fff8e8;
      --cream-border: #f4d6ad;
      --green: #5ca56d;
    }

    body {
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      text-align: center;
      padding: 20px 12px 28px;
      margin: 0;
      min-height: 100vh;
      color: var(--brown);
      background-color: #fff5d9;
      background-image: url("background.png");
      background-position: center top;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* タイトル：木の看板風 */
    h1 {
      display: inline-block;
      position: relative;
      max-width: 94%;
      margin: 12px auto 24px;
      padding: 14px 42px 16px;
      border: 4px solid #d99b5d;
      border-radius: 28px 24px 30px 22px;
      background: linear-gradient(
        180deg,
        #ffe0a1 0%,
        #f8c77f 55%,
        #edb56e 100%
      );
      box-shadow:
        inset 0 3px 0 rgba(255,255,255,.65),
        inset 0 -4px 0 rgba(156,91,43,.12),
        0 5px 0 rgba(151,94,49,.12);
      color: #794727;
      font-size: clamp(25px, 4vw, 42px);
      font-weight: 900;
      letter-spacing: .12em;
      text-shadow: 0 1px 0 rgba(255,255,255,.6);
    }

    /* 受付結果パネル */
    #result {
      margin: 12px auto 16px;
      padding: 20px 16px;
      width: 100%;
      max-width: 820px;
      min-height: 0;
      font-size: clamp(23px, 3vw, 36px);
      font-weight: 900;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
      border: 5px solid var(--cream-border);
      border-radius: 48px;
      background: rgba(255, 249, 233, .96);
      box-shadow:
        0 5px 0 rgba(184, 129, 73, .10),
        inset 0 0 0 2px rgba(255,255,255,.8);
    }

    #result:empty {
      display: none;
    }

    #result.ok {
      color: #805337;
      background: rgba(255, 249, 233, .97);
      border-color: #f0d1a6;
    }

    #result.error {
      color: #a8322c;
      background: rgba(255, 244, 233, .98);
      border-color: #e5a08b;
    }

    #result.waiting {
      color: #805337;
      background: rgba(255, 249, 233, .97);
      border-color: #e8c89d;
    }

    /* 状態表示 */
    #status {
      display: block;
      width: fit-content;
      max-width: 95%;
      margin: 12px auto;
      padding: 6px 18px;
      border-radius: 18px;
      color: var(--brown);
      background: rgba(255, 249, 233, .70);
      font-size: clamp(17px, 2.2vw, 23px);
      font-weight: 900;
      line-height: 1.5;
      text-shadow: 0 1px 0 rgba(255,255,255,.85);
    }

    /* カメラ：クリーム色の丸いフレーム */
    #reader {
      width: 100%;
      max-width: 640px;
      margin: 14px auto 10px;
      padding: 10px;
      border: 5px solid var(--cream-border);
      border-radius: 38px;
      background: rgba(255, 249, 233, .97);
      box-shadow:
        0 5px 0 rgba(184, 129, 73, .12),
        inset 0 0 0 2px rgba(255,255,255,.85);
      overflow: hidden;
      color: var(--brown);
    }

    #reader video {
      display: block;
      width: 100% !important;
      max-width: 100%;
      border-radius: 24px;
      object-fit: cover;
    }

    #reader__scan_region {
      min-height: 240px;
      border-radius: 24px;
      overflow: hidden;
      background: #f7ead2;
    }

    #reader__scan_region video {
      border-radius: 24px;
    }

    #reader__dashboard {
      padding-top: 8px;
      color: var(--brown);
      font-size: 15px;
    }

    #reader__dashboard_section_csr,
    #reader__dashboard_section_swaplink {
      color: var(--brown);
    }

    #reader a {
      color: var(--brown);
    }

    /* カメラ選択 */
    #reader select {
      max-width: 100%;
      padding: 8px 10px;
      border: 1px solid #e7c99f;
      border-radius: 999px;
      background: #fff4dc;
      color: var(--brown);
      font-size: 15px;
    }

    /* カメラ操作ボタン */
    #reader button {
      max-width: 100%;
      font-size: 16px;
      font-weight: 800;
      padding: 11px 17px;
      margin: 5px;
      border: 2px solid #e5c29a;
      border-radius: 999px;
      background: linear-gradient(#d6a77e, #bd895f);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(126, 78, 43, .12);
    }

    #reader button:hover,
    #buttons button:hover {
      filter: brightness(1.04);
    }

    /* 再試行ボタン */
    #buttons button {
      font-size: 18px;
      font-weight: 900;
      padding: 13px 24px;
      margin: 8px;
      border: 2px solid #e5c29a;
      border-radius: 999px;
      background: linear-gradient(#d6a77e, #bd895f);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(126, 78, 43, .14);
    }

    /* 画面下の案内 */
    .hint {
      display: inline-block;
      max-width: 640px;
      margin: 12px auto;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 249, 233, .68);
      color: var(--brown);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.8;
      text-shadow: 0 1px 0 rgba(255,255,255,.85);
    }

    /* スマホ・タブレット向け */
    @media (max-width: 600px) {
      body {
        padding: 12px 8px 22px;
      }

      h1 {
        margin: 8px auto 18px;
        padding: 11px 24px 13px;
        border-radius: 22px;
        letter-spacing: .08em;
      }

      #result {
        padding: 16px 10px;
        border-radius: 30px;
        border-width: 4px;
      }

      #reader {
        padding: 7px;
        border-width: 4px;
        border-radius: 28px;
      }

      #reader__scan_region,
      #reader video {
        border-radius: 18px;
      }

      #reader button {
        font-size: 14px;
        padding: 9px 12px;
      }

      #status {
        font-size: 17px;
      }

      .hint {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <h1>社員受付</h1>

  <!-- 受付結果を画面上部に表示 -->
  <div id="result" aria-live="polite"></div>

  <p id="status">カメラを準備しています…</p>

  <div id="reader"></div>

  <div id="buttons"></div>

  <p class="hint">
    QRカードを1枚ずつカメラに映してください。<br>
    出席記録は自動で行われます。
  </p>

  <script>
    // ========================================
    // Apps Script URL（本番用）
    // ========================================
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyAJlvXfXFLtn0iTYh6obTzeoe-YkTW8YVzVMtAHPEsOzEnkO_6scH3_9W8MOCzE9Yh/exec";

    // ========================================
    // 状態管理
    // ========================================
    let scanner = null;
    let processing = false;
    let lastHandledToken = "";
    let messageTimer = null;
    let audioContext = null;

    // ========================================
    // QRIDの表記統一
    // ========================================
    function normalizeToken(token) {
      return String(token || "")
        .replace(/\s/g, "")
        .trim();
    }

    // ========================================
    // 音声の準備
    // ========================================
    function prepareAudio() {
      try {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }
      } catch (error) {
        console.log("音声を準備できませんでした", error);
      }
    }

    document.addEventListener(
      "pointerdown",
      prepareAudio,
      { once: true }
    );

    // ========================================
    // 成功音
    // ========================================
    function playSuccessSound() {
      try {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        const play = () => {
          const now = audioContext.currentTime;

          const tones = [
            {
              frequency: 880,
              start: 0,
              duration: 0.22
            },
            {
              frequency: 1320,
              start: 0.20,
              duration: 0.40
            }
          ];

          tones.forEach(tone => {
            const oscillator =
              audioContext.createOscillator();

            const gain =
              audioContext.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value =
              tone.frequency;

            gain.gain.setValueAtTime(
              0.0001,
              now + tone.start
            );

            gain.gain.exponentialRampToValueAtTime(
              0.8,
              now + tone.start + 0.025
            );

            gain.gain.setValueAtTime(
              0.8,
              now + tone.start + tone.duration - 0.06
            );

            gain.gain.exponentialRampToValueAtTime(
              0.0001,
              now + tone.start + tone.duration
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start(now + tone.start);

            oscillator.stop(
              now + tone.start + tone.duration
            );
          });
        };

        if (audioContext.state === "suspended") {
          audioContext.resume()
            .then(play)
            .catch(error => {
              console.log("成功音を再生できませんでした", error);
            });
        } else {
          play();
        }

      } catch (error) {
        console.log("成功音を再生できませんでした", error);
      }
    }

    // ========================================
    // Apps ScriptとのJSONP通信
    // ========================================
    function requestJSONP(params, onSuccess, onError) {
      const callbackName =
        "qrCallback_" +
        Date.now() + "_" +
        Math.floor(Math.random() * 1000000);

      const script = document.createElement("script");

      let finished = false;

      const timer = setTimeout(() => {
        cleanup();
        onError("通信がタイムアウトしました。");
      }, 15000);

      function cleanup() {
        if (finished) return;

        finished = true;
        clearTimeout(timer);

        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] = undefined;
        }

        script.remove();
      }

      window[callbackName] = response => {
        cleanup();
        onSuccess(response);
      };

      script.onerror = () => {
        cleanup();
        onError("サーバーとの通信に失敗しました。");
      };

      const query = new URLSearchParams({
        ...params,
        callback: callbackName,
        t: Date.now()
      });

      script.src =
        APPS_SCRIPT_URL + "?" + query.toString();

      document.body.appendChild(script);
    }

    // ========================================
    // 画面表示
    // ========================================
    function setStatus(message) {
      document.getElementById("status").textContent =
        message;
    }

    function showMessage(message, type) {
      const result = document.getElementById("result");

      result.textContent = message;
      result.className = type || "";
    }

    function clearResultLater() {
      clearTimeout(messageTimer);

      messageTimer = setTimeout(() => {
        if (!processing) {
          showMessage("", "");
        }
      }, 2500);
    }

    // ========================================
    // QR認識後の自動出席記録
    // ========================================
    function onScanSuccess(decodedText) {
      if (processing) return;

      const token = normalizeToken(decodedText);

      if (!token) return;

      // 同じQRの重複処理を防止
      if (token === lastHandledToken) return;

      processing = true;
      lastHandledToken = token;

      clearTimeout(messageTimer);
      document.getElementById("buttons").innerHTML = "";

      setStatus("認証中・出席を記録しています…");

      showMessage("認証中…", "waiting");

      // QRIDの検証と出席記録
      requestJSONP(
        {
          action: "attendance",
          token: token
        },

        response => {
          processing = false;

          if (!response || !response.ok) {
            setStatus("出席記録ができませんでした");

            showMessage(
              "✕ 記録失敗\n\n" +
              (
                response?.message ||
                "QRカードを確認してください。"
              ),
              "error"
            );

            showRetryButton();
            return;
          }

          // 成功音
          playSuccessSound();

          setStatus("次の方を受付できます");

          showMessage(
            "✓ 受付完了！\n" +
            response.name + " さん\n\n" +
            "出席記録が完了しました",
            "ok"
          );

          // 結果表示だけ消す。カメラは動作継続
          clearResultLater();
        },

        message => {
          processing = false;

          setStatus("通信に失敗しました");

          showMessage(
            "✕ 通信エラー\n\n" + message,
            "error"
          );

          showRetryButton();
        }
      );
    }

    // ========================================
    // エラー時の再試行
    // ========================================
    function showRetryButton() {
      const buttons =
        document.getElementById("buttons");

      buttons.innerHTML = "";

      const retry = document.createElement("button");
      retry.textContent = "もう一度読み取る";

      retry.onclick = () => {
        if (processing) return;

        // 同じカードを再試行できるようにする
        lastHandledToken = "";

        buttons.innerHTML = "";
        showMessage("", "");

        setStatus(
          "QRカードをカメラに映してください"
        );

        // カメラの再起動はしない
      };

      buttons.appendChild(retry);
    }

    // ========================================
    // カメラボタンの日本語化
    // ========================================
    function translateCameraButtons() {
      document.querySelectorAll("#reader button")
        .forEach(button => {
          const text = button.textContent.trim();

          if (
            text.includes("Request Camera Permissions") ||
            text.includes("Start Camera")
          ) {
            button.textContent = "カメラを起動";
          }

          if (text.includes("Stop Scanning")) {
            button.textContent = "カメラを停止";
          }

          if (text.includes("Scan an Image File")) {
            button.textContent = "画像ファイルを読み取る";
          }
        });
    }

    // ========================================
    // カメラを起動
    // ========================================
    function startScanner() {
      if (scanner) return;

      if (typeof Html5QrcodeScanner === "undefined") {
        setStatus(
          "QR読み取りライブラリを読み込めません"
        );

        showMessage(
          "インターネット接続を確認して再読み込みしてください。",
          "error"
        );

        return;
      }

      setStatus("カメラを起動しています…");

      try {
        scanner = new Html5QrcodeScanner(
          "reader",
          {
            fps: 20,
            qrbox: {
              width: 280,
              height: 280
            },
            rememberLastUsedCamera: true
          },
          false
        );

        scanner.render(
          decodedText => {
            onScanSuccess(decodedText);
          },
          () => {
            // QR未検出時は何も表示しない
          }
        );

        setTimeout(translateCameraButtons, 300);
        setTimeout(translateCameraButtons, 1000);
        setTimeout(translateCameraButtons, 2000);

        setStatus(
          "QRカードをカメラに映してください"
        );

      } catch (error) {
        scanner = null;

        setStatus("カメラを起動できません");

        showMessage(
          "カメラの起動に失敗しました。ページを再読み込みしてください。",
          "error"
        );
      }
    }

    // ========================================
    // 初回起動
    // ========================================
    startScanner();
  </script>

</body>
</html>
