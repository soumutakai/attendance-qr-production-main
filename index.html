
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 16px;
      margin: 0;
      background: #fff;
    }

    h1 {
      font-size: 28px;
    }

    #status {
      font-size: 20px;
      min-height: 1.5em;
    }

    #reader {
      max-width: 500px;
      margin: 16px auto;
    }

    #reader video {
      max-width: 100%;
    }

    #result {
      margin: 20px auto;
      padding: 14px;
      max-width: 500px;
      box-sizing: border-box;
      font-size: 22px;
      font-weight: bold;
      white-space: pre-line;
      overflow-wrap: anywhere;
      border-radius: 10px;
    }

    #result.ok {
      color: #087b27;
      background: #e8f7ec;
    }

    #result.error {
      color: #c62828;
      background: #fff0f0;
    }

    button {
      font-size: 18px;
      padding: 12px 22px;
      margin: 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .hint {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>社員受付</h1>

  <p id="status">カメラを準備しています…</p>

  <div id="reader"></div>

  <div id="result" aria-live="polite"></div>

  <div id="buttons"></div>

  <p class="hint">
    QRカードを順番にカメラへ映してください。
    出席記録は自動で行われます。
  </p>

  <script>
    // ========================================
    // Apps Script URL
    // ========================================
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyAJlvXfXFLtn0iTYh6obTzeoe-YkTW8YVzVMtAHPEsOzEnkO_6scH3_9W8MOCzE9Yh/exec";

    // ========================================
    // 状態管理
    // ========================================
    let scanner = null;
    let processing = false;

    // 直前に処理したQRの重複登録を防ぐ
    let lastHandledToken = "";

    let audioContext = null;
    let messageTimer = null;

    // ========================================
    // QRIDの表記統一
    // ========================================
    function normalizeToken(token) {
      return String(token || "")
        .replace(/\s/g, "")
        .trim();
    }

    // ========================================
    // 音声の準備
    // 最初の画面操作でブラウザの音声制限に対応
    // ========================================
    function prepareAudio() {
      try {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }
      } catch (e) {
        // 音声が使えなくても受付を継続
      }
    }

    document.addEventListener(
      "pointerdown",
      prepareAudio,
      { once: true }
    );

    function playSuccessSound() {
      if (
        !audioContext ||
        audioContext.state !== "running"
      ) {
        return;
      }

      try {
        const oscillator =
          audioContext.createOscillator();

        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 1000;

        gain.gain.setValueAtTime(
          0.15,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.2
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(
          audioContext.currentTime + 0.2
        );
      } catch (e) {
        // 音声エラーは無視
      }
    }

    // ========================================
    // Apps ScriptとのJSONP通信
    // ========================================
    function requestJSONP(params, onSuccess, onError) {
      const callbackName =
        "cb_" + Date.now() + "_" +
        Math.floor(Math.random() * 1000000);

      const script = document.createElement("script");

      let finished = false;

      const timer = setTimeout(() => {
        cleanup();
        onError("通信がタイムアウトしました。");
      }, 15000);

      function cleanup() {
        if (finished) return;

        finished = true;
        clearTimeout(timer);

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

        script.remove();
      }

      window[callbackName] = result => {
        cleanup();
        onSuccess(result);
      };

      script.onerror = () => {
        cleanup();
        onError("サーバーとの通信に失敗しました。");
      };

      const query = new URLSearchParams({
        ...params,
        callback: callbackName,
        t: Date.now()
      });

      script.src =
        APPS_SCRIPT_URL + "?" + query.toString();

      document.body.appendChild(script);
    }

    // ========================================
    // 画面表示
    // ========================================
    function showMessage(message, type) {
      const result = document.getElementById("result");

      result.textContent = message;
      result.className = type || "";
    }

    function setStatus(message) {
      document.getElementById("status").textContent =
        message;
    }

    // ========================================
    // QR認識後の処理
    // カメラは停止しない
    // ========================================
    function onScanSuccess(decodedText) {
      if (processing) return;

      const token = normalizeToken(decodedText);

      if (!token) return;

      // 同じカードが映り続けても再登録しない
      if (token === lastHandledToken) return;

      // 通信開始前にロックして二重送信を防止
      processing = true;
      lastHandledToken = token;

      setStatus("QRを認識しました。出席を記録しています…");
      showMessage("出席記録中…", "");
      document.getElementById("buttons").innerHTML = "";

      // 社員認証と出席記録を1回の通信で実行
      requestJSONP(
        {
          action: "attendance",
          token: token
        },

        response => {
          processing = false;

          if (!response || !response.ok) {
            setStatus(
              "記録できませんでした。QRカードを確認してください。"
            );

            showMessage(
              response?.message ||
                "出席記録に失敗しました。",
              "error"
            );

            showRetryButton(token);
            return;
          }

          // 記録成功
          playSuccessSound();

          setStatus(
            "受付中です。次の方はQRカードを映してください。"
          );

          showMessage(
            "✓ " + response.name +
              " さん\n出席記録が完了しました",
            "ok"
          );

          // 結果表示だけを時間経過で消す
          // カメラは停止・再起動しない
          clearTimeout(messageTimer);

          messageTimer = setTimeout(() => {
            if (!processing) {
              showMessage("", "");
            }
          }, 1800);
        },

        message => {
          processing = false;

          setStatus(
            "通信に失敗しました。もう一度お試しください。"
          );

          showMessage(message, "error");
          showRetryButton(token);
        }
      );
    }

    // ========================================
    // 同じQRの再試行
    // ========================================
    function showRetryButton(token) {
      const buttons = document.getElementById("buttons");

      buttons.innerHTML = "";

      const retry = document.createElement("button");
      retry.textContent = "このQRを再試行";

      retry.onclick = () => {
        if (processing) return;

        // 同じカードをもう一度処理できるようにする
        lastHandledToken = "";
        buttons.innerHTML = "";

        showMessage("", "");
        setStatus("QRカードをカメラに映してください。");

        // カメラはそのまま動かし続ける
      };

      buttons.appendChild(retry);
    }

    // ========================================
    // カメラボタンの日本語化
    // ========================================
    function translateCameraButtons() {
      document.querySelectorAll("#reader button")
        .forEach(button => {
          const text = button.textContent.trim();

          if (
            text.includes("Request Camera Permissions") ||
            text.includes("Start Camera")
          ) {
            button.textContent = "カメラを起動";
          }

          if (text.includes("Stop Scanning")) {
            button.textContent = "カメラを停止";
          }

          if (text.includes("Scan an Image File")) {
            button.textContent = "画像ファイルを読み取る";
          }
        });
    }

    // ========================================
    // カメラを最初の1回だけ起動
    // ========================================
    function startScanner() {
      if (scanner) return;

      if (typeof Html5QrcodeScanner === "undefined") {
        setStatus("QR読み取りライブラリを読み込めません。");
        showMessage(
          "インターネット接続を確認して再読み込みしてください。",
          "error"
        );
        return;
      }

      setStatus("カメラを起動しています…");

      try {
        scanner = new Html5QrcodeScanner(
          "reader",
          {
            fps: 20,
            qrbox: {
              width: 280,
              height: 280
            },
            rememberLastUsedCamera: true
          },
          false
        );

        scanner.render(
          decodedText => {
            onScanSuccess(decodedText);
          },
          () => {
            // QRが映っていない間のエラーは表示しない
          }
        );

        setTimeout(translateCameraButtons, 300);
        setTimeout(translateCameraButtons, 1000);

        setStatus(
          "QRカードをカメラに映してください。"
        );

      } catch (error) {
        scanner = null;

        setStatus("カメラを起動できません。");

        showMessage(
          "カメラの起動に失敗しました。ページを再読み込みしてください。",
          "error"
        );
      }
    }

    // ========================================
    // 初回起動
    // ========================================
    startScanner();
  </script>

</body>
</html>
