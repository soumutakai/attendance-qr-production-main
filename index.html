
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      text-align: center;
      padding: 12px;
      margin: 0;
      background: #f7f9fc;
      color: #222;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
    }

    /* 受付結果：画面上部 */
    #result {
      margin: 12px auto;
      padding: 20px 12px;
      width: 100%;
      max-width: 650px;
      min-height: 0;
      font-size: 30px;
      font-weight: bold;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
      border: 4px solid transparent;
      border-radius: 16px;
    }

    #result:empty {
      display: none;
    }

    #result.ok {
      color: #087b27;
      background: #d9fbe2;
      border-color: #16a34a;
      box-shadow: 0 4px 16px rgba(0, 120, 40, 0.18);
    }

    #result.error {
      color: #c62828;
      background: #fff0f0;
      border-color: #dc2626;
    }

    #result.waiting {
      color: #444;
      background: #edf2f7;
      border-color: #cbd5e1;
    }

    #status {
      font-size: 21px;
      font-weight: bold;
      min-height: 1.5em;
      margin: 10px 0;
    }

    /* カメラ */
    #reader {
      max-width: 500px;
      margin: 12px auto;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }

    #reader video {
      max-width: 100%;
    }

    #reader button {
      font-size: 17px;
      padding: 10px 16px;
      margin: 6px;
      border-radius: 8px;
      cursor: pointer;
    }

    #buttons button {
      font-size: 19px;
      font-weight: bold;
      padding: 13px 24px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    .hint {
      font-size: 15px;
      line-height: 1.7;
      color: #555;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 27px;
      }

      #result {
        font-size: 25px;
        padding: 16px 10px;
      }

      #status {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <h1>社員受付</h1>

  <!-- 受付結果を画面上部に表示 -->
  <div id="result" aria-live="polite"></div>

  <p id="status">カメラを準備しています…</p>

  <div id="reader"></div>

  <div id="buttons"></div>

  <p class="hint">
    QRカードを1枚ずつカメラに映してください。<br>
    出席記録は自動で行われます。
  </p>

  <script>
    // ========================================
    // Apps Script URL（本番用）
    // ========================================
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyAJlvXfXFLtn0iTYh6obTzeoe-YkTW8YVzVMtAHPEsOzEnkO_6scH3_9W8MOCzE9Yh/exec";

    // ========================================
    // 状態管理
    // ========================================
    let scanner = null;
    let processing = false;
    let lastHandledToken = "";
    let messageTimer = null;
    let audioContext = null;

    // ========================================
    // QRIDの表記統一
    // ========================================
    function normalizeToken(token) {
      return String(token || "")
        .replace(/\s/g, "")
        .trim();
    }

    // ========================================
    // 音声の準備
    // 最初に画面をタップして音声を有効化
    // ========================================
    function prepareAudio() {
      try {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }
      } catch (error) {
        console.log("音声を準備できませんでした", error);
      }
    }

    document.addEventListener(
      "pointerdown",
      prepareAudio,
      { once: true }
    );

    // ========================================
    // 成功音：大きなピンポーン！
    // 出席記録成功時に再生
    // ========================================
    function playSuccessSound() {
      try {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        const play = () => {
          const now = audioContext.currentTime;

          const tones = [
            {
              frequency: 880,
              start: 0,
              duration: 0.22
            },
            {
              frequency: 1320,
              start: 0.20,
              duration: 0.40
            }
          ];

          tones.forEach(tone => {
            const oscillator =
              audioContext.createOscillator();

            const gain =
              audioContext.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value =
              tone.frequency;

            gain.gain.setValueAtTime(
              0.0001,
              now + tone.start
            );

            gain.gain.exponentialRampToValueAtTime(
              0.8,
              now + tone.start + 0.025
            );

            gain.gain.setValueAtTime(
              0.8,
              now + tone.start + tone.duration - 0.06
            );

            gain.gain.exponentialRampToValueAtTime(
              0.0001,
              now + tone.start + tone.duration
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start(now + tone.start);

            oscillator.stop(
              now + tone.start + tone.duration
            );
          });
        };

        if (audioContext.state === "suspended") {
          audioContext.resume()
            .then(play)
            .catch(error => {
              console.log("成功音を再生できませんでした", error);
            });
        } else {
          play();
        }

      } catch (error) {
        console.log("成功音を再生できませんでした", error);
      }
    }

    // ========================================
    // Apps ScriptとのJSONP通信
    // ========================================
    function requestJSONP(params, onSuccess, onError) {
      const callbackName =
        "qrCallback_" +
        Date.now() + "_" +
        Math.floor(Math.random() * 1000000);

      const script = document.createElement("script");

      let finished = false;

      const timer = setTimeout(() => {
        cleanup();
        onError("通信がタイムアウトしました。");
      }, 15000);

      function cleanup() {
        if (finished) return;

        finished = true;
        clearTimeout(timer);

        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] = undefined;
        }

        script.remove();
      }

      window[callbackName] = response => {
        cleanup();
        onSuccess(response);
      };

      script.onerror = () => {
        cleanup();
        onError("サーバーとの通信に失敗しました。");
      };

      const query = new URLSearchParams({
        ...params,
        callback: callbackName,
        t: Date.now()
      });

      script.src =
        APPS_SCRIPT_URL + "?" + query.toString();

      document.body.appendChild(script);
    }

    // ========================================
    // 画面表示
    // ========================================
    function setStatus(message) {
      document.getElementById("status").textContent =
        message;
    }

    function showMessage(message, type) {
      const result = document.getElementById("result");

      result.textContent = message;
      result.className = type || "";
    }

    function clearResultLater() {
      clearTimeout(messageTimer);

      messageTimer = setTimeout(() => {
        if (!processing) {
          showMessage("", "");
        }
      }, 2500);
    }

    // ========================================
    // QR認識後の自動出席記録
    // カメラは停止しない
    // ========================================
    function onScanSuccess(decodedText) {
      if (processing) return;

      const token = normalizeToken(decodedText);

      if (!token) return;

      // 同じQRが映り続ける場合の重複処理を防止
      if (token === lastHandledToken) return;

      processing = true;
      lastHandledToken = token;

      clearTimeout(messageTimer);
      document.getElementById("buttons").innerHTML = "";

      setStatus("認証中・出席を記録しています…");

      showMessage("認証中…", "waiting");

      // QRIDの検証と出席記録を1回の通信で実行
      requestJSONP(
        {
          action: "attendance",
          token: token
        },

        response => {
          processing = false;

          if (!response || !response.ok) {
            setStatus("出席記録ができませんでした");

            showMessage(
              "✕ 記録失敗\n\n" +
              (
                response?.message ||
                "QRカードを確認してください。"
              ),
              "error"
            );

            showRetryButton();
            return;
          }

          // 成功音
          playSuccessSound();

          setStatus("次の方を受付できます");

          // 画面上部に大きく表示
          showMessage(
            "✓ 受付完了！\n" +
            response.name + " さん\n\n" +
            "出席記録が完了しました",
            "ok"
          );

          // 結果表示だけ消す。カメラは動作継続
          clearResultLater();
        },

        message => {
          processing = false;

          setStatus("通信に失敗しました");

          showMessage(
            "✕ 通信エラー\n\n" + message,
            "error"
          );

          showRetryButton();
        }
      );
    }

    // ========================================
    // エラー時の再試行
    // ========================================
    function showRetryButton() {
      const buttons =
        document.getElementById("buttons");

      buttons.innerHTML = "";

      const retry = document.createElement("button");
      retry.textContent = "もう一度読み取る";

      retry.onclick = () => {
        if (processing) return;

        // 同じカードを再試行できるようにする
        lastHandledToken = "";

        buttons.innerHTML = "";
        showMessage("", "");

        setStatus(
          "QRカードをカメラに映してください"
        );

        // カメラの再起動はしない
      };

      buttons.appendChild(retry);
    }

    // ========================================
    // カメラボタンの日本語化
    // ========================================
    function translateCameraButtons() {
      document.querySelectorAll("#reader button")
        .forEach(button => {
          const text = button.textContent.trim();

          if (
            text.includes("Request Camera Permissions") ||
            text.includes("Start Camera")
          ) {
            button.textContent = "カメラを起動";
          }

          if (text.includes("Stop Scanning")) {
            button.textContent = "カメラを停止";
          }

          if (text.includes("Scan an Image File")) {
            button.textContent = "画像ファイルを読み取る";
          }
        });
    }

    // ========================================
    // カメラを最初の1回だけ起動
    // ========================================
    function startScanner() {
      if (scanner) return;

      if (typeof Html5QrcodeScanner === "undefined") {
        setStatus(
          "QR読み取りライブラリを読み込めません"
        );

        showMessage(
          "インターネット接続を確認して再読み込みしてください。",
          "error"
        );

        return;
      }

      setStatus("カメラを起動しています…");

      try {
        scanner = new Html5QrcodeScanner(
          "reader",
          {
            fps: 20,
            qrbox: {
              width: 280,
              height: 280
            },
            rememberLastUsedCamera: true
          },
          false
        );

        scanner.render(
          decodedText => {
            onScanSuccess(decodedText);
          },
          () => {
            // QR未検出時は何も表示しない
          }
        );

        setTimeout(translateCameraButtons, 300);
        setTimeout(translateCameraButtons, 1000);
        setTimeout(translateCameraButtons, 2000);

        setStatus(
          "QRカードをカメラに映してください"
        );

      } catch (error) {
        scanner = null;

        setStatus("カメラを起動できません");

        showMessage(
          "カメラの起動に失敗しました。ページを再読み込みしてください。",
          "error"
        );
      }
    }

    // ========================================
    // 初回起動
    // ========================================
    startScanner();
  </script>

</body>
</html>
